name: Daily Tumblr AI Auto Publisher

on:
  schedule:
    # Run once daily at 9:30 PM AEST (11:30 AM UTC)
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (generate and archive only, do not publish to Tumblr)'
        type: boolean
        required: false
        default: false
      topic:
        description: 'Manual topic override (leave blank for random rotation)'
        type: string
        required: false
        default: ''

permissions:
  contents: write # Required to commit back the archive and published_hashes.txt

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history to avoid any issue when pushing updates
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Publisher
        env:
          # AI API
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Tumblr API
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          BLOG_NAME: ${{ secrets.BLOG_NAME }}
          # Workflow Inputs
          DRY_RUN: ${{ github.event.inputs.dry-run || 'false' }}
          MANUAL_TOPIC: ${{ github.event.inputs.topic || '' }}
          # Configs
          WORD_COUNT_MIN: '800'
          WORD_COUNT_MAX: '1200'
          GEMINI_MODEL: 'gemini-2.0-flash'
        run: |
          python -m src.main


      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Initialize files if they were created
          git add archive/ published_hashes.txt || true
          
          # Only commit and push if there are changes
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Archive generated post and update published hashes"
            git push origin HEAD:main
          else
            echo "No new files or changes to commit."
          fi
